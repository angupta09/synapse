services:
  db:
    image: pgvector/pgvector:pg16
    container_name: team-a-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teama
      POSTGRES_PASSWORD: teama
      POSTGRES_DB: team_a
    ports:
      - "5432:5432"
    volumes:
      - team_a_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teama -d team_a"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  team_a_pgdata:
